main{max-width:1400px;margin:0 auto;padding:16px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}

input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:0}

table{border-collapse:collapse;width:100%;font-size:13px}

th{background:#faf9f7;font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;cursor:default}

    if (LOCAL){ const now = new Date().toISOString(); rows.forEach(r=>r.created_at=now); S[tb].push(...rows); DB.saveLocal(tb); return rows; }
    const out = [];
    for (let i=0;i<rows.length;i+=500){ const {data,error} = await sb.from(MAP[tb].table).insert(rows.slice(i,i+500).map(MAP[tb].to)).select(); if (error) throw error; out.push(...data.map(MAP[tb].from)); }
    S[tb].push(...out); return out;
  },
  async update(tb, id, patch){
    if (LOCAL){ const r = S[tb].find(x=>x.id===id); Object.assign(r, patch); DB.saveLocal(tb); return r; }
    const {data,error} = await sb.from(MAP[tb].table).update(MAP[tb].to(patch)).eq('id', id).select().single(); if (error) throw error;
    const i = S[tb].findIndex(x=>x.id===id); S[tb][i] = MAP[tb].from(data); return S[tb][i];
  },
  async remove(tb, id){
    if (!LOCAL){ const {error} = await sb.from(MAP[tb].table).delete().eq('id', id); if (error) throw error; }
    S[tb] = S[tb].filter(x=>x.id!==id); if (LOCAL) DB.saveLocal(tb);
  },
  async loadAll(){ for (const tb of TABLES) S[tb] = await DB.all(tb); }
};

/* фото: сжимаем в браузере до ~1280px JPEG */
function compressImage(file, max = 1280){
  return new Promise((res, rej) => { const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { let {width:w, height:h} = img; const k = Math.min(1, max/Math.max(w,h)); w = Math.round(w*k); h = Math.round(h*k);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      c.toBlob(b => res(b), 'image/jpeg', 0.82); };
    img.onerror = rej; img.src = url; });
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
const photoCache = {};
async function photoUrl(p){
  if (p.startsWith('data:')) return p;
  if (photoCache[p]) return photoCache[p];
  const {data} = await sb.storage.from(PHOTO_BUCKET).createSignedUrl(p, 3600);
  return photoCache[p] = data?.signedUrl || '';
}
async function uploadPhoto(itemId, file){
  const blob = await compressImage(file);
  if (LOCAL) return blobToDataURL(await compressImage(file, 700));
  const path = `${itemId}/${Date.now()}-${Math.random().toString(16).slice(2,8)}.jpg`;
  const {error} = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, {contentType:'image/jpeg'}); if (error) throw error;
  return path;
}
async function removePhoto(p){ if (!LOCAL && !p.startsWith('data:')) await sb.storage.from(PHOTO_BUCKET).remove([p]); }

const supName = id => { const s = S.suppliers.find(x=>x.id===id); return s ? (LANG==='zh' && s.name_zh ? s.name_zh : s.name) : '—'; };
const shipName = id => { const s = S.shipments.find(x=>x.id===id); return s ? s.number : ''; };
const amt = it => it.amount != null && it.amount !== '' ? +it.amount : (+it.qty||0) * (+it.price||0);
function effRating(it){
  if (it.rating != null && it.rating !== '') return +it.rating;
  const v = PARAMS.map(p=>it[p]).filter(x=>x!=null && x!=='').map(Number);
  return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null;
}
const isChecked = it => effRating(it) != null || !!it.has_claim;

function agg(items){
  const a = {n:items.length, qty:0, amount:0, checkedN:0, checkedQty:0, claimItems:0, claimQty:0, claimAmt:0, rw:0, rs:0, deliv:new Set(), delivChecked:new Set(), params:{}, reasons:{}};
  PARAMS.forEach(p=>a.params[p]={s:0,n:0});
  for (const it of items){
    const q = +it.qty||0; a.qty += q; a.amount += amt(it);
    const dk = it.supplier_id+'|'+it.purchase_date+'|'+(it.invoice_no||''); a.deliv.add(dk);
    if (!isChecked(it)) continue;
    a.checkedN++; a.checkedQty += q; a.delivChecked.add(dk);
    const r = effRating(it); if (r != null){ const w = Math.max(q,1); a.rw += w; a.rs += r*w; }
    PARAMS.forEach(p=>{ if (it[p]!=null && it[p]!==''){ a.params[p].s += +it[p]; a.params[p].n++; } });
    if (it.has_claim){ a.claimItems++; a.claimQty += +it.claim_qty||0; a.claimAmt += +it.claim_amount||0; (it.claim_reasons||[]).forEach(k=>a.reasons[k]=(a.reasons[k]||0)+1); }
  }
  a.avgRating = a.rw ? a.rs/a.rw : null;
  a.defectPct = a.checkedQty ? a.claimQty/a.checkedQty*100 : null;
  a.claimRate = a.checkedN ? a.claimItems/a.checkedN*100 : null;
  a.deliveries = a.deliv.size; a.delivCheckedN = a.delivChecked.size;
  PARAMS.forEach(p=>a.params[p] = a.params[p].n ? a.params[p].s/a.params[p].n : null);
  if (!a.checkedN){ a.index = null; a.verdict = 'v_none'; return a; }
  const comps = [];
  if (a.avgRating != null) comps.push([0.5, (a.avgRating-1)/4*100]);
  comps.push([0.3, Math.max(0, 100 - a.defectPct*CFG.pen)]);
  comps.push([0.2, 100 - a.claimRate]);
  a.index = comps.reduce((s,[w,v])=>s+w*v,0) / comps.reduce((s,[w])=>s+w,0);
  a.verdict = a.delivCheckedN < CFG.minDeliv ? 'v_few' : a.index >= CFG.contract ? 'v_contract' : a.index >= CFG.drop ? 'v_watch' : 'v_drop';
  return a;
}

function stars(r){ if (r==null) return '<span class="muted">—</span>'; const f = Math.round(r); return `<span style="white-space:nowrap"><span class="stars">${'★'.repeat(f)}<span class="off">${'★'.repeat(5-f)}</span></span> <span class="muted">${fmt(r,1)}</span></span>`; }

const PER = {items:{preset:'allTime',from:'',to:''}, sum:{preset:'thisYear',from:'',to:''}};
function presetRange(p){
  const d = new Date(), y = d.getFullYear(), m = d.getMonth(); const iso = x => x.toISOString().slice(0,10);
  const loc = (yy,mm,dd) => new Date(Date.UTC(yy,mm,dd));
  switch(p){
    case 'thisMonth': return [iso(loc(y,m,1)), iso(loc(y,m+1,0))];
    case 'lastMonth': return [iso(loc(y,m-1,1)), iso(loc(y,m,0))];
    case 'thisYear': return [`${y}-01-01`, `${y}-12-31`];
    case 'lastYear': return [`${y-1}-01-01`, `${y-1}-12-31`];
    default: return ['',''];
  }
}
function periodUI(key){
  const P = PER[key];
  const opts = ['thisMonth','lastMonth','thisYear','lastYear','allTime','custom'].map(o=>`<option value="${o}" ${P.preset===o?'selected':''}>${t(o)}</option>`).join('');
  return `<label>${t('period')}<select data-per="${key}" data-f="preset">${opts}</select></label>
    <label>${t('from')}<input type="date" data-per="${key}" data-f="from" value="${P.from}"></label>
    <label>${t('to')}<input type="date" data-per="${key}" data-f="to" value="${P.to}"></label>`;
}
function bindPeriod(key, rerender){
  document.querySelectorAll(`[data-per="${key}"]`).forEach(el => el.onchange = () => {
    const P = PER[key];
    if (el.dataset.f === 'preset'){ P.preset = el.value; if (el.value!=='custom'){ [P.from,P.to] = presetRange(el.value); } }
    else { P[el.dataset.f] = el.value; P.preset = 'custom'; }
    rerender();
  });
}
const inPer = (it, key) => { const P = PER[key]; const d = it.purchase_date||''; return (!P.from || d >= P.from) && (!P.to || d <= P.to); };

function loadSheet(){
  const ws = IMP.wb.Sheets[IMP.sheet];
  IMP.aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
  let hr = 0;
  for (let i=0;i<Math.min(20,IMP.aoa.length);i++){ const r = IMP.aoa[i]; const txt = r.filter(c=>typeof c==='string' && c.trim()).length;
    const hits = r.filter(c=>typeof c==='string' && FIELDS.some(([,,syn])=>syn.some(s=>c.toLowerCase().includes(s)))).length;
    if (txt>=3 && hits>=2){ hr=i; break; } }
  IMP.hr = hr; guessMap();
}
function guessMap(){
  const hdr = (IMP.aoa[IMP.hr]||[]).map(c=>String(c).toLowerCase().trim()); IMP.map = {}; const used = new Set();
  for (const [k,,syn] of FIELDS){ const i = hdr.findIndex((h,idx)=>!used.has(idx) && h && syn.some(s=>h.includes(s))); if (i>=0){ IMP.map[k]=i; used.add(i); } }
}
function parseDate(v){
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() - v.getTimezoneOffset()*60000); return d.toISOString().slice(0,10); }
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v-25569)*86400000)); return d.toISOString().slice(0,10); }
  const s = String(v||'').trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/))) { const y = m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return null;
}
function findSupplier(name){ const n = name.trim().toLowerCase(); return S.suppliers.find(s=>s.name.trim().toLowerCase()===n || (s.name_zh||'').trim().toLowerCase()===n); }
function parsedRows(){
  const out = []; const M = IMP.map; const g = (r,k) => M[k]!=null ? r[M[k]] : '';
  for (let i=IMP.hr+1;i<IMP.aoa.length;i++){ const r = IMP.aoa[i]; if (!r.some(c=>String(c).trim())) continue;
    const row = { purchase_date: (M.purchase_date!=null && parseDate(g(r,'purchase_date'))) || IMP.def.date,
      supplierName: M.supplier!=null ? String(g(r,'supplier')).trim() : '', supplier_id: M.supplier!=null ? null : IMP.def.supplier,
      invoice_no: String(g(r,'invoice_no')||IMP.def.invoice||'').trim() || null,
      flower: String(g(r,'flower')).trim(), variety: String(g(r,'variety')).trim()||null, grade: String(g(r,'grade')).trim()||null,
      qty: num(g(r,'qty')), unit: String(g(r,'unit')).trim()||'шт', price: num(g(r,'price')), amount: num(g(r,'amount')) };
    if (row.supplierName){ const s = findSupplier(row.supplierName); row.supplier_id = s?.id || null; }
    if (row.amount==null && row.qty!=null && row.price!=null) row.amount = Math.round(row.qty*row.price*100)/100;
    if (row.price==null && row.amount!=null && row.qty) row.price = Math.round(row.amount/row.qty*10000)/10000;
    const low = row.flower.toLowerCase();
    row.skip = !row.flower || row.qty==null || /итог|всего|total|合计|总计/.test(low);
    row.ok = !row.skip && (row.supplier_id || row.supplierName);
    out.push(row); }
  return out;
}

  $('#iSheet').onchange = e => { IMP.sheet = e.target.value; loadSheet(); drawImport(); };

  for (const sh of ships){ for (let j=0;j<8;j++){ const si = Math.floor(Math.random()*created.length); const [, , , q, def] = sups[si]; const f = fl[Math.floor(Math.random()*fl.length)];
    const qty = Math.round(rnd(1,8))*100; const price = +(f[2]*rnd(.85,1.2)).toFixed(2); const it = {shipment_id:sh.id, supplier_id:created[si].id, purchase_date:sh.ship_date, invoice_no:'N'+Math.floor(rnd(1000,9999)),
      flower:f[0], variety:f[1], grade: f[0]==='Роза'?['50 см','60 см','70 см'][Math.floor(Math.random()*3)]:null, qty, unit:'шт', price, amount:+(qty*price).toFixed(2), photos:[], claim_reasons:[]};
    if (Math.random()<.85){ PARAMS.forEach(p=>it[p]=clamp(q+rnd(-1,1))); const hit = Math.random() < def*4;
      if (hit){ const cq = Math.round(qty*rnd(def*.5,def*2)); Object.assign(it,{has_claim:true, claim_qty:cq, claim_amount:+(cq*price).toFixed(2), claim_status:['open','comp','rej'][Math.floor(Math.random()*3)], claim_reasons:[Object.keys(REASONS)[Math.floor(Math.random()*9)]]}); } }
    items.push(it); } }
  await DB.insert('purchase_items', items);
}

/* ================= СТАРТ ================= */
function authLoginEmail(login){
  const l = String(login||'').trim().toLowerCase();
  if (/^[a-z0-9._-]+$/.test(l)) return l + '@' + AMMA_LOGIN_DOMAIN;
  return 'u-' + Array.from(new TextEncoder().encode(l), b => b.toString(16).padStart(2,'0')).join('') + '@' + AMMA_LOGIN_DOMAIN;
}
async function isStaff(){
  const {data:w, error} = await sb.rpc('app_whoami');
  if (error || w?.status !== 'active') return false;
  const {data:u} = await sb.from('users').select('role').eq('id', w.id).maybeSingle();
  return STAFF_ROLES.includes(u?.role);
}
async function start(){
  $('#app').innerHTML = `<div class="empty">${t('loading')}</div>`;
  if (!LOCAL){
    const {data:{session}} = await sb.auth.getSession();
    if (!session) return loginScreen();
    USER = session.user;
    if (!(await isStaff())) return loginScreen(t('noAccess'));
  }
  try { await DB.loadAll(); } catch(e){ $('#app').innerHTML = `<div class="card login"><b>${t('loadErr')}</b><p>${esc(e.message)}</p><p class="hint">${t('loadHint')}</p></div>`; return; }
  shell();
}
function loginScreen(msg){
  $('#app').innerHTML = `<div class="card login"><h2>AMMA · ${t('app')}</h2>
    <input id="lEmail" placeholder="${t('login2')}" autocomplete="username"><input id="lPass" type="password" placeholder="${t('password')}" autocomplete="current-password">
    <button class="btn pri" style="width:100%" id="lGo">${t('login')}</button><p class="hint" id="lErr">${msg?esc(msg):''}</p></div>`;
  if (msg) sb.auth.signOut();
  const go = async () => { const id = $('#lEmail').value.trim();
    const email = id.includes('@') ? id.toLowerCase() : authLoginEmail(id);
    const {error} = await sb.auth.signInWithPassword({email, password:$('#lPass').value});
    if (error) $('#lErr').textContent = LANG==='zh' ? '账号或密码错误' : 'Неверный логин или пароль'; else start(); };
  $('#lGo').onclick = go; $('#lPass').onkeydown = e => { if (e.key==='Enter') go(); };
}
start();
</script>
